<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de tareas</title>

  <style>
    /* Las tareas completadas se ven tachadas */
    .completada {
      text-decoration: line-through;
    }
  </style>
</head>
<body>

  <!-- ========== ESQUELETO (HTML) ========== -->

  <h1>Lista de tareas</h1>

  <!-- Caja para escribir y botón para agregar -->
  <input type="text" id="cajaTarea" placeholder="Escribe una tarea">
  <button id="botonAgregar">Agregar</button>

  <!-- Aquí se dibujan las tareas -->
  <ul id="listaTareas"></ul>

  <!-- Ventana de confirmación: oculta hasta que se pide con showModal() -->
  <dialog id="ventanaConfirmar">
    <p>Confirma borrar tarea no completada</p>
    <button id="botonConfirmar">Confirmar</button>
    <button id="botonCancelar">Cancelar</button>
  </dialog>


  <!-- ========== LÓGICA (JavaScript) ========== -->
  <script>
    // ---------- ELEMENTOS DE LA PÁGINA ----------
    const cajaTarea = document.getElementById("cajaTarea");
    const botonAgregar = document.getElementById("botonAgregar");
    const listaTareas = document.getElementById("listaTareas");
    const ventanaConfirmar = document.getElementById("ventanaConfirmar");
    const botonConfirmar = document.getElementById("botonConfirmar");
    const botonCancelar = document.getElementById("botonCancelar");

    // ---------- DATOS ----------
    // Nombre ("llave") con el que guardamos todo en localStorage
    const CLAVE_GUARDADO = "tareas";

    // Aquí viven las tareas. Cada una es un objeto así:
    // { id: 1700000000000, texto: "Comprar pan", completada: false }
    let tareas = [];

    // Id de la tarea que espera confirmación para borrarse (null = ninguna)
    let idPorBorrar = null;

    // ---------- GUARDAR Y CARGAR (localStorage) ----------

    // Guarda el arreglo "tareas" en el navegador.
    // localStorage solo guarda texto, por eso usamos JSON.stringify
    // para convertir el arreglo en texto.
    function guardarTareas() {
      try {
        localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(tareas));
      } catch (error) {
        console.error("No se pudo guardar:", error);
      }
    }

    // Lee lo guardado y lo convierte otra vez en arreglo con JSON.parse.
    // Si no hay nada guardado (primera vez) o está dañado, empezamos vacío.
    function cargarTareas() {
      try {
        const textoGuardado = localStorage.getItem(CLAVE_GUARDADO);
        if (textoGuardado) {
          const datos = JSON.parse(textoGuardado);
          if (Array.isArray(datos)) {
            tareas = datos;
          }
        }
      } catch (error) {
        console.error("No se pudo cargar:", error);
        tareas = [];
      }
    }

    // ---------- DIBUJAR LA LISTA ----------
    // Borra lo que se ve y vuelve a dibujar todas las tareas del arreglo.
    function dibujarLista() {
      listaTareas.innerHTML = "";

      tareas.forEach(function (tarea) {
        const elemento = document.createElement("li");

        const textoTarea = document.createElement("span");
        textoTarea.textContent = tarea.texto;

        // Si la tarea está completada, le ponemos la clase que la tacha
        if (tarea.completada) {
          textoTarea.classList.add("completada");
        }

        // Al tocar el texto: cambiamos completada, guardamos y redibujamos
        textoTarea.addEventListener("click", function () {
          alternarCompletada(tarea.id);
        });

        const botonBorrar = document.createElement("button");
        botonBorrar.textContent = "Borrar";

        // Completada: se borra directo. No completada: pedimos confirmación.
        botonBorrar.addEventListener("click", function () {
          if (tarea.completada) {
            borrarTarea(tarea.id);
          } else {
            idPorBorrar = tarea.id;
            ventanaConfirmar.showModal();
          }
        });

        elemento.appendChild(textoTarea);
        elemento.appendChild(botonBorrar);
        listaTareas.appendChild(elemento);
      });
    }

    // ---------- ACCIONES (cada una guarda los cambios) ----------

    function agregarTarea() {
      const texto = cajaTarea.value.trim();
      if (texto === "") {
        return;
      }

      tareas.push({
        id: Date.now(),      // número único basado en la hora actual
        texto: texto,
        completada: false
      });

      guardarTareas();       // GUARDAMOS
      dibujarLista();

      cajaTarea.value = "";
      cajaTarea.focus();
    }

    function alternarCompletada(id) {
      const tarea = tareas.find(function (t) {
        return t.id === id;
      });

      if (tarea) {
        tarea.completada = !tarea.completada;  // true pasa a false y viceversa
        guardarTareas();                       // GUARDAMOS
        dibujarLista();
      }
    }

    function borrarTarea(id) {
      // Nos quedamos con todas las tareas MENOS la que tiene ese id
      tareas = tareas.filter(function (t) {
        return t.id !== id;
      });

      guardarTareas();       // GUARDAMOS
      dibujarLista();
    }

    // ---------- EVENTOS ----------

    botonAgregar.addEventListener("click", agregarTarea);

    cajaTarea.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter") {
        agregarTarea();
      }
    });

    // Ventana de confirmación
    botonConfirmar.addEventListener("click", function () {
      if (idPorBorrar !== null) {
        borrarTarea(idPorBorrar);
      }
      ventanaConfirmar.close();
    });

    botonCancelar.addEventListener("click", function () {
      ventanaConfirmar.close();
    });

    // Al cerrarse la ventana (botón o tecla Esc), olvidamos la tarea pendiente
    ventanaConfirmar.addEventListener("close", function () {
      idPorBorrar = null;
    });

    // ---------- AL ABRIR LA PÁGINA ----------
    cargarTareas();   // leemos lo guardado
    dibujarLista();   // y lo mostramos
  </script>

</body>
</html>
